<!-- includes/sidebar.html -->
<!-- Wrapper for role-specific sidebars with premium glass design -->

<aside class="sidebar glass-sidebar" id="sidebar">
    <!-- Brand / Logo -->
    <div class="sidebar-brand d-flex align-items-center gap-3 mb-4 px-3">
        <div class="brand-icon d-flex align-items-center justify-content-center rounded-circle bg-primary bg-opacity-20" style="width: 44px; height: 44px;">
            <i class="bi bi-qr-code-scan fs-4 text-primary"></i>
        </div>
        <span class="brand-text fw-bold text-white fs-5" style="font-family: 'Sora', sans-serif;">
            QR Attendance
        </span>
        <button class="btn btn-link sidebar-collapse-btn ms-auto d-none d-md-block" type="button" id="collapseSidebarBtn">
            <i class="bi bi-chevron-left text-white-50"></i>
        </button>
    </div>

    <!-- Role-based Navigation -->
    <nav class="sidebar-nav">
        {% if user_role == "admin" %}
            {% include "includes/admin_sidebar.html" %}
        {% elif user_role == "teacher" %}
            {% include "includes/teacher_sidebar.html" %}
        {% elif user_role == "student" %}
            {% include "includes/student_sidebar.html" %}
        {% else %}
            <!-- Fallback: generic nav items (should not happen) -->
            <div class="text-center text-muted small p-3">No role assigned</div>
        {% endif %}
    </nav>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer mt-auto px-3 pt-3 border-top border-white-10">
        <div class="d-flex align-items-center gap-2 text-white-50 small">
            <i class="bi bi-shield-check"></i>
            <span>Secure v2.0</span>
        </div>
    </div>
</aside>

<!-- Overlay for mobile (click outside to close) -->
<div id="sidebarOverlay"></div>

<style>
    /* ========================================================
       SIDEBAR - Premium Glass Neon Purple Theme
       ======================================================== */
    .glass-sidebar {
        background: rgba(9, 8, 32, 0.75);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-right: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 4px 0 32px rgba(0, 0, 0, 0.4);
        width: 280px;
        min-height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1040;
        padding: 1.5rem 0.75rem 1rem;
        transition: width 0.3s ease, transform 0.3s ease;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
    }

    /* Scrollbar */
    .glass-sidebar::-webkit-scrollbar {
        width: 4px;
    }
    .glass-sidebar::-webkit-scrollbar-track {
        background: transparent;
    }
    .glass-sidebar::-webkit-scrollbar-thumb {
        background: rgba(112, 48, 239, 0.4);
        border-radius: 10px;
    }

    /* Brand */
    .brand-icon {
        background: rgba(112, 48, 239, 0.2);
        color: var(--primary);
        flex-shrink: 0;
    }
    .brand-text {
        letter-spacing: -0.02em;
        white-space: nowrap;
    }

    /* Sidebar collapse button (desktop) */
    .sidebar-collapse-btn {
        color: rgba(255, 255, 255, 0.4);
        padding: 0.2rem 0.4rem;
        transition: var(--transition);
        border-radius: 6px;
    }
    .sidebar-collapse-btn:hover {
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
    }

    /* Navigation items (styles applied to the included sidebar items) */
    .sidebar-nav .nav {
        flex-direction: column;
        gap: 0.25rem;
    }
    .sidebar-nav .nav-item {
        list-style: none;
        margin: 0;
        padding: 0;
    }
    .sidebar-nav .nav-link {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.6rem 1rem;
        border-radius: 12px;
        color: rgba(255, 255, 255, 0.65);
        font-weight: 500;
        font-size: 0.95rem;
        transition: var(--transition);
        text-decoration: none;
        position: relative;
        white-space: nowrap;
        overflow: hidden;
    }
    .sidebar-nav .nav-link i {
        font-size: 1.2rem;
        width: 1.5rem;
        text-align: center;
        flex-shrink: 0;
        color: rgba(255, 255, 255, 0.5);
        transition: var(--transition);
    }
    .sidebar-nav .nav-link:hover {
        background: rgba(112, 48, 239, 0.15);
        color: #ffffff;
        transform: translateX(4px);
    }
    .sidebar-nav .nav-link:hover i {
        color: var(--primary);
    }
    .sidebar-nav .nav-link.active {
        background: linear-gradient(135deg, rgba(112, 48, 239, 0.25), rgba(219, 31, 255, 0.15));
        color: #ffffff;
        box-shadow: inset 3px 0 0 var(--primary), 0 4px 16px rgba(112, 48, 239, 0.2);
    }
    .sidebar-nav .nav-link.active i {
        color: var(--primary);
    }
    .sidebar-nav .nav-link .badge {
        margin-left: auto;
        background: rgba(219, 31, 255, 0.2);
        color: #DB1FFF;
        font-weight: 600;
        padding: 0.2rem 0.6rem;
        border-radius: 30px;
        font-size: 0.7rem;
    }

    /* Sidebar collapsed state (desktop) */
    .sidebar.collapsed {
        width: 80px;
        padding: 1.5rem 0.4rem;
    }
    .sidebar.collapsed .brand-text,
    .sidebar.collapsed .sidebar-collapse-btn,
    .sidebar.collapsed .nav-link span:not(.badge),
    .sidebar.collapsed .nav-link .badge,
    .sidebar.collapsed .sidebar-footer span {
        display: none;
    }
    .sidebar.collapsed .nav-link {
        justify-content: center;
        padding: 0.6rem;
        border-radius: 12px;
    }
    .sidebar.collapsed .nav-link i {
        font-size: 1.4rem;
        margin: 0;
    }
    .sidebar.collapsed .brand-icon {
        margin: 0 auto;
    }
    .sidebar.collapsed .sidebar-footer {
        text-align: center;
        border-top: none;
    }
    .sidebar.collapsed .sidebar-footer i {
        font-size: 1.2rem;
    }

    /* Mobile sidebar */
    @media (max-width: 768px) {
        .glass-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 2000;
            background: rgba(9, 8, 32, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 4px 0 48px rgba(0, 0, 0, 0.6);
            padding: 1.5rem 0.75rem;
        }
        .glass-sidebar.open {
            transform: translateX(0);
        }
        /* Ensure hamburger button stays above content */
        .sidebar-toggle-btn {
            z-index: 2100;
            position: relative;
        }
        /* Show text on mobile */
        .glass-sidebar .brand-text,
        .glass-sidebar .nav-link span,
        .glass-sidebar .sidebar-footer span {
            display: inline !important;
        }
        .glass-sidebar .nav-link {
            justify-content: flex-start !important;
            padding: 0.6rem 1rem !important;
        }
        .glass-sidebar .nav-link i {
            font-size: 1.2rem !important;
        }
        .glass-sidebar .sidebar-collapse-btn {
            display: none !important;
        }
    }

    /* Overlay */
    #sidebarOverlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        z-index: 1999;
        backdrop-filter: blur(2px);
    }
    #sidebarOverlay.show {
        display: block;
    }

    /* Utilities */
    .border-white-10 {
        border-color: rgba(255, 255, 255, 0.06) !important;
    }
    .text-white-50 {
        color: rgba(255, 255, 255, 0.5) !important;
    }
</style>

<!-- JavaScript for sidebar control -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const sidebar = document.getElementById("sidebar");
        const mobileBtn = document.getElementById("mobileSidebarToggle");
        const collapseBtn = document.getElementById("collapseSidebarBtn");
        const overlay = document.getElementById("sidebarOverlay");
        const main = document.querySelector(".main");

        // ----- Desktop collapse (arrow button) -----
        if (collapseBtn && sidebar) {
            collapseBtn.addEventListener("click", function () {
                sidebar.classList.toggle("collapsed");
                if (main) main.classList.toggle("expanded");
                // Change icon direction
                const icon = this.querySelector("i");
                if (sidebar.classList.contains("collapsed")) {
                    icon.className = "bi bi-chevron-right";
                    localStorage.setItem("sidebarCollapsed", "true");
                } else {
                    icon.className = "bi bi-chevron-left";
                    localStorage.setItem("sidebarCollapsed", "false");
                }
            });
        }

        // Restore collapsed state from localStorage
        if (sidebar && window.innerWidth > 768) {
            const collapsed = localStorage.getItem("sidebarCollapsed") === "true";
            if (collapsed) {
                sidebar.classList.add("collapsed");
                if (main) main.classList.add("expanded");
                const icon = collapseBtn?.querySelector("i");
                if (icon) icon.className = "bi bi-chevron-right";
            }
        }

        // ----- Mobile hamburger toggle -----
        if (mobileBtn && sidebar) {
            mobileBtn.addEventListener("click", function (e) {
                e.stopPropagation();
                sidebar.classList.toggle("open");
                if (overlay) overlay.classList.toggle("show");
            });
        }

        // Close sidebar when clicking outside (mobile)
        if (overlay) {
            overlay.addEventListener("click", function () {
                sidebar.classList.remove("open");
                overlay.classList.remove("show");
            });
        }

        // Also close on window resize to desktop (if open)
        window.addEventListener("resize", function () {
            if (window.innerWidth > 768 && sidebar.classList.contains("open")) {
                sidebar.classList.remove("open");
                if (overlay) overlay.classList.remove("show");
            }
        });
    });
</script>
