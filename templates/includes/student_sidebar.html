<!-- includes/student_sidebar.html -->
<!-- Student Sidebar - Premium Glass Neon Purple Theme -->

<div class="sidebar-nav">
    <ul class="nav flex-column">

        <!-- Dashboard -->
        <li class="nav-item">
            <a class="nav-link" href="{% url 'student_dashboard' %}">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
        </li>

        <!-- Attendance (with collapse) -->
        <li class="nav-item">
            <a class="nav-link d-flex justify-content-between align-items-center" 
               data-bs-toggle="collapse" 
               href="#studentAttendanceMenu" 
               role="button" 
               aria-expanded="false">
                <span>
                    <i class="bi bi-calendar-check"></i>
                    Attendance
                </span>
                <i class="bi bi-chevron-down small"></i>
            </a>
            <div class="collapse" id="studentAttendanceMenu">
                <ul class="nav flex-column ms-3 mt-1">

                    <!-- ✅ REMOVED: broken scan_qr_page link -->
                    <!-- Students now use Google Lens / phone QR scanner -->

                    <!-- ✅ OPTIONAL: helpful instruction (remove if not needed) -->
                    <li class="nav-item">
                        <span class="nav-link py-1 text-muted">
                            <i class="bi bi-phone"></i>
                            <span>Scan teacher QR using Google Lens</span>
                        </span>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link py-1" href="{% url 'attendance_history' %}">
                            <i class="bi bi-clock-history"></i>
                            <span>Attendance History</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link py-1" href="{% url 'attendance_percentage' %}">
                            <i class="bi bi-pie-chart"></i>
                            <span>Attendance Percentage</span>
                        </a>
                    </li>

                </ul>
            </div>
        </li>

        <!-- Profile -->
        <li class="nav-item">
            <a class="nav-link" href="{% url 'student_profile' %}">
                <i class="bi bi-person-circle"></i>
                <span>Profile</span>
            </a>
        </li>

        <!-- Attendance Calendar -->
        <li class="nav-item">
            <a class="nav-link" href="{% url 'attendance_calendar' %}">
                <i class="bi bi-calendar-event"></i>
                <span>Attendance Calendar</span>
            </a>
        </li>

        <!-- Logout (with top border) -->
        <li class="nav-item mt-2 border-top border-white-10 pt-2">
            <a class="nav-link text-danger" href="{% url 'logout' %}">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>
        </li>

    </ul>
</div>

<style>
    /* Styles are inherited from parent sidebar, but we add student-specific tweaks if needed */
    .sidebar-nav .nav-link {
        padding: 0.6rem 1rem;
        border-radius: 12px;
        color: rgba(255, 255, 255, 0.65);
        transition: var(--transition);
        font-weight: 500;
        font-size: 0.95rem;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }
    .sidebar-nav .nav-link i {
        font-size: 1.2rem;
        width: 1.5rem;
        text-align: center;
        flex-shrink: 0;
        color: rgba(255, 255, 255, 0.5);
        transition: var(--transition);
    }
    .sidebar-nav .nav-link:hover {
        background: rgba(112, 48, 239, 0.15);
        color: #ffffff;
        transform: translateX(4px);
    }
    .sidebar-nav .nav-link:hover i {
        color: var(--primary);
    }
    .sidebar-nav .nav-link.active {
        background: linear-gradient(135deg, rgba(112, 48, 239, 0.25), rgba(219, 31, 255, 0.15));
        color: #ffffff;
        box-shadow: inset 3px 0 0 var(--primary), 0 4px 16px rgba(112, 48, 239, 0.2);
    }
    .sidebar-nav .nav-link.active i {
        color: var(--primary);
    }
    .sidebar-nav .nav-link .bi-chevron-down {
        transition: transform 0.3s ease;
    }
    .sidebar-nav .nav-link[aria-expanded="true"] .bi-chevron-down {
        transform: rotate(180deg);
    }

    /* Submenu items */
    .sidebar-nav .nav .nav .nav-link {
        padding: 0.4rem 1rem 0.4rem 2.5rem;
        font-size: 0.9rem;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.5);
    }
    .sidebar-nav .nav .nav .nav-link i {
        font-size: 0.9rem;
        width: 1.2rem;
        color: rgba(255, 255, 255, 0.3);
    }
    .sidebar-nav .nav .nav .nav-link:hover {
        background: rgba(112, 48, 239, 0.08);
        color: #ffffff;
        transform: translateX(2px);
    }
    .sidebar-nav .nav .nav .nav-link:hover i {
        color: var(--primary);
    }

    /* Instruction item (non-clickable) */
    .sidebar-nav .nav-link.text-muted {
        cursor: default;
        opacity: 0.7;
    }
    .sidebar-nav .nav-link.text-muted:hover {
        background: transparent;
        transform: none;
    }
    .sidebar-nav .nav-link.text-muted i {
        color: var(--text-muted);
    }

    /* Collapsed state overrides (handled by parent) */
    .sidebar.collapsed .sidebar-nav .nav-link span:not(.badge) {
        display: none;
    }
    .sidebar.collapsed .sidebar-nav .nav-link {
        justify-content: center;
        padding: 0.6rem;
    }
    .sidebar.collapsed .sidebar-nav .nav-link i {
        font-size: 1.4rem;
        margin: 0;
    }
    .sidebar.collapsed .sidebar-nav .nav .nav .nav-link {
        padding: 0.4rem;
        justify-content: center;
    }
    .sidebar.collapsed .sidebar-nav .nav .nav .nav-link span {
        display: none !important;
    }
    .sidebar.collapsed .sidebar-nav .nav .nav .nav-link i {
        font-size: 1.1rem;
        margin: 0;
        width: auto;
    }
    .sidebar.collapsed .sidebar-nav .nav-item .collapse {
        display: none !important;
    }

    .border-white-10 {
        border-color: rgba(255, 255, 255, 0.06) !important;
    }
</style>
