{% extends 'base_dashboard.html' %}

{% block title %}Add Student{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold">Add Student</h2>
            <p class="text-muted">
                Register a new student into the attendance system.
            </p>
        </div>

        <a href="{% url 'student_list' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
            Back
        </a>

    </div>

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-success">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}

    <div class="card shadow border-0 rounded-4">

        <div class="card-body p-4">

            <form method="POST">

                {% csrf_token %}

                <div class="row">

                    <!-- LEFT COLUMN -->

                    <div class="col-md-6">

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                First Name
                            </label>

                            <input
                                type="text"
                                name="first_name"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Last Name
                            </label>

                            <input
                                type="text"
                                name="last_name"
                                class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                        </div>

                    </div>

                    <!-- RIGHT COLUMN -->

                    <div class="col-md-6">

                        <div class="mb-3">

                            <label class="form-label">
                                Register Number
                            </label>

                            <input
                                type="text"
                                name="register_number"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Department
                            </label>

                            <select
                                name="department"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Department
                                </option>

                                {% for department in departments %}

                                    <option value="{{ department.id }}">

                                        {{ department.department_name }}

                                    </option>

                                {% endfor %}

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Year
                            </label>

                            <select
                                name="year"
                                class="form-select">

                                <option value="1">I Year</option>
                                <option value="2">II Year</option>
                                <option value="3">III Year</option>
                                <option value="4">IV Year</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Section
                            </label>

                            <input
                                type="text"
                                name="section"
                                class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control">

                        </div>

                    </div>

                </div>

                <hr>

                <div class="text-end">

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg">

                        <i class="bi bi-person-plus-fill"></i>

                        Add Student

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
